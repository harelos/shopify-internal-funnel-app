# Custom Distribution configuration. Fill the client_id and public HTTPS URL
# in the Shopify Dev Dashboard before deploying. An Admin-created custom app
# cannot be embedded with App Bridge.
client_id = "336aed7a0572b8179610ed2e5698cd78"
name = "Funnel Control Internal"
application_url = "https://shopify-funnel-control.tigerbrands-funnel.workers.dev"
embedded = true

[build]
automatically_update_urls_on_dev = false

[access_scopes]
scopes = "read_orders,read_reports,read_pixels,write_app_proxy,write_pixels,read_customer_events"

[app_proxy]
url = "https://shopify-funnel-control.tigerbrands-funnel.workers.dev"
subpath = "funnels"
prefix = "apps"

[webhooks]
api_version = "2026-07"

[[webhooks.subscriptions]]
topics = ["orders/paid", "orders/updated"]
uri = "https://shopify-funnel-control.tigerbrands-funnel.workers.dev/webhooks/shopify"

[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri = "https://shopify-funnel-control.tigerbrands-funnel.workers.dev/webhooks/shopify"

[auth]
redirect_urls = ["https://shopify-funnel-control.tigerbrands-funnel.workers.dev/auth/callback"]
