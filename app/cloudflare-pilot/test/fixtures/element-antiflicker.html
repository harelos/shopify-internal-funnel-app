<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Element anti-flicker QA</title>
    <style>
      @keyframes fixture-fail-open { to { opacity: 1; pointer-events: auto; } }
      .nova .hero-media:not([data-fce-ready="true"]) {
        opacity: 0;
        pointer-events: none;
        animation: fixture-fail-open 1ms linear 2900ms forwards;
      }
      .hero-media { width: 390px; min-height: 350px; background: #f4f1eb; }
      .original-gallery { width: 100%; min-height: 350px; background: #9b2030; color: white; }
    </style>
  </head>
  <body>
    <main class="nova">
      <div class="hero-media"><div class="original-gallery">ORIGINAL CONTROL GALLERY</div></div>
    </main>
    <script type="application/json" data-funnel-control-config>
      {
        "endpoint": "/apps/funnels",
        "pagePath": "/pages/novahair-sales-staging",
        "revealTimeoutMs": 900,
        "debug": true,
        "isInternal": true,
        "slots": [{
          "slotKey": "novahair.sales.gallery.primary",
          "selector": ".nova .hero-media",
          "pagePath": "/pages/novahair-sales-staging"
        }]
      }
    </script>
    <script src="/assets/antiflicker-observer.js"></script>
    <script src="/assets/funnel-control-elements.js"></script>
  </body>
</html>
