query SupportOrderContext($query: String!) {
  orders(first: 10, query: $query, sortKey: CREATED_AT, reverse: true) {
    nodes {
      id
      name
      createdAt
      cancelledAt
      displayFinancialStatus
      displayFulfillmentStatus
      totalPriceSet {
        shopMoney {
          amount
          currencyCode
        }
      }
      lineItems(first: 20) {
        nodes {
          name
          quantity
          sku
        }
      }
      fulfillments {
        displayStatus
        estimatedDeliveryAt
        deliveredAt
        trackingInfo {
          company
          number
          url
        }
      }
    }
  }
}
