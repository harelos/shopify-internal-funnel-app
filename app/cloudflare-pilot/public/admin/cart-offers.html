<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="shopify-api-key" content="%SHOPIFY_API_KEY%">
  <script src="https://cdn.shopify.com/shopifycloud/app-bridge.js"></script>
  <title>Cart Offers</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/cart-offers.css">
  <link rel="stylesheet" href="css/commerce-os.css">
  <script defer src="js/commerce-os-shell.js"></script>
</head>
<body>
  <header class="top-bar">
    <div class="top-bar-inner">
      <div class="brand">
        <a class="brand-name" href="index.html">Shopify Funnel Control</a>
        <span class="badge badge-active" id="published-badge">Published version</span>
      </div>
      <nav class="top-actions" aria-label="App navigation">
        <a class="btn" href="ai-concierge.html">AI Concierge</a>
        <a class="btn" href="popup-analytics.html">Popup Analytics</a>
      </nav>
    </div>
  </header>

  <main class="main offer-admin">
    <div class="offer-heading">
      <div>
        <p class="eyebrow">NovaHair side cart</p>
        <h1>Cart offers</h1>
        <p class="muted" id="revision-copy">Loading saved version…</p>
      </div>
      <div class="heading-actions">
        <button class="btn" id="save-draft" type="button">Save draft</button>
        <button class="btn btn-primary" id="publish" type="button">Publish to store</button>
      </div>
    </div>

    <div class="publish-status" id="status" role="status" aria-live="polite"></div>

    <section class="offer-section" aria-labelledby="carousel-heading">
      <div class="section-heading">
        <div>
          <h2 id="carousel-heading">Complementary product carousel</h2>
          <label class="wide-field">Carousel heading
            <input class="input" id="carousel-title" maxlength="90" autocomplete="off">
          </label>
        </div>
        <button class="btn" id="add-carousel" type="button">Add product</button>
      </div>
      <div class="offer-list" id="carousel-list"></div>
    </section>

    <section class="offer-section" aria-labelledby="bumps-heading">
      <div class="section-heading">
        <div>
          <h2 id="bumps-heading">Order bumps above the total</h2>
          <p class="muted">Shown before the order total. Each product can be added only once.</p>
        </div>
        <button class="btn" id="add-bump" type="button">Add bump</button>
      </div>
      <div class="offer-list" id="bump-list"></div>
    </section>
  </main>

  <div class="modal-overlay" id="product-picker" hidden>
    <div class="modal product-picker-dialog" role="dialog" aria-modal="true" aria-labelledby="picker-title">
      <div class="picker-heading">
        <h2 id="picker-title">Choose a store product</h2>
        <button class="icon-button" id="close-picker" type="button" aria-label="Close">×</button>
      </div>
      <label>Search by product name
        <input class="input" id="product-search" type="search" autocomplete="off" placeholder="For example: hair mask">
      </label>
      <div class="picker-results" id="picker-results" role="list"></div>
    </div>
  </div>

  <template id="offer-item-template">
    <article class="offer-item">
      <div class="offer-product">
        <img class="offer-image" alt="" width="76" height="76">
        <div class="offer-product-copy">
          <strong class="selected-product">No product selected</strong>
          <span class="selected-variant muted"></span>
          <button class="btn btn-sm choose-product" type="button">Choose product</button>
        </div>
        <label class="enabled-control"><input type="checkbox" data-field="enabled"> Enabled</label>
      </div>
      <div class="offer-fields">
        <label>Customer-facing title<input class="input" data-field="title" maxlength="90"></label>
        <label>Offer price
          <span class="money-input"><bdi>₪</bdi><input class="input" data-field="priceIls" inputmode="decimal" pattern="[0-9]+([.][0-9]{1,2})?"></span>
        </label>
        <label>Compare-at price
          <span class="money-input"><bdi>₪</bdi><input class="input" data-field="compareAtIls" inputmode="decimal" pattern="[0-9]+([.][0-9]{1,2})?"></span>
        </label>
        <label>Price helper text<input class="input" data-field="anchorText" maxlength="70"></label>
        <label>Button text<input class="input" data-field="buttonText" maxlength="30"></label>
        <label>Image alt text<input class="input" data-field="imageAlt" maxlength="140"></label>
      </div>
      <div class="offer-item-actions">
        <span class="shopify-price muted"></span>
        <button class="icon-button move-up" type="button" aria-label="Move up" title="Move up">↑</button>
        <button class="icon-button move-down" type="button" aria-label="Move down" title="Move down">↓</button>
        <button class="icon-button remove-item" type="button" aria-label="Delete" title="Delete">×</button>
      </div>
    </article>
  </template>

  <script src="js/api.js"></script>
  <script src="js/cart-offers.js"></script>
</body>
</html>
