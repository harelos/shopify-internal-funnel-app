api_version = "2026-07"

[[extensions]]
name = "NovaHair Bundle Expand"
handle = "novahair-bundle-expand"
type = "function"
uid = "1937eeab-fac5-f836-72ac-eed7cae64d0e1485c843"
description = "Expands NOVASALE bundle variants into their physical shade variants plus one free kit, so CJ can fulfil them from six 1:1 product connections instead of 295."

  [[extensions.targeting]]
  target = "cart.transform.run"
  input_query = "src/cart_transform_run.graphql"
  export = "cart-transform-run"

  [extensions.build]
  command = ""
  path = "dist/function.wasm"

  [extensions.ui.paths]
  create = "/"
  details = "/"
