<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="shopify-api-key" content="%SHOPIFY_API_KEY%">
  <script src="https://cdn.shopify.com/shopifycloud/app-bridge.js"></script>
  <title>HTML Editor — Funnel Builder</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; background: #1e1e1e; color: #fff; }
    .editor-top { display: flex; align-items: center; justify-content: space-between; padding: 10px 18px; background: #252526; border-bottom: 1px solid #333; }
    .editor-tabs { display: flex; background: #2d2d2d; border-bottom: 1px solid #333; }
    .editor-tab { padding: 8px 20px; font-size: 13px; font-weight: 600; cursor: pointer; color: #999; border-bottom: 2px solid transparent; }
    .editor-tab.active { color: #fff; border-bottom-color: #d85336; background: #1e1e1e; }
    #editor-container { flex: 1; width: 100%; height: calc(100vh - 100px); position: relative; }
    .editor-loader { position: absolute; top:0; left:0; right:0; bottom:0; background: #1e1e1e; display: flex; align-items: center; justify-content: center; font-family: var(--mono); color: #888; font-size: 14px; z-index: 10; }
    .port-bar { padding: 8px 18px; font-family: var(--mono); font-size: 12px; background: #2d2d2d; border-top: 1px solid #333; color: #a3e635; display: flex; justify-content: space-between; }
  </style>
</head>
<body>
  <div class="editor-top">
    <div>
      <a href="#" id="back-link" style="color:#aaa; font-weight:bold;">← Back to Funnel</a>
      <span style="margin: 0 10px; color:#555;">|</span>
      <span style="font-weight:700; font-size:15px;" id="variant-title">Editing Variant</span>
      <span class="badge badge-draft" id="variant-badge" style="margin-left:8px;">DRAFT</span>
    </div>
    <div style="display:flex; gap:8px;">
      <button class="btn btn-sm" id="btn-preview-tab">Safe Preview</button>
      <button class="btn btn-sm btn-primary" id="btn-save">Save HTML (Ctrl+S)</button>
      <button class="btn btn-sm" id="btn-publish" style="background:#197b5b; color:#fff; border-color:#197b5b;">Publish</button>
    </div>
  </div>

  <div class="editor-tabs">
    <div class="editor-tab active" data-mode="html">HTML Markup</div>
  </div>

  <div id="editor-container">
    <div id="editor-loader" class="editor-loader">Loading Monaco Code Editor environment...</div>
  </div>

  <div class="port-bar">
    <span id="port-status">Initializing Editor...</span>
    <span id="port-report" style="color:#cbd5e1;">Portability: Safe</span>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
  <script src="js/api.js"></script>
  <script src="js/editor.js"></script>
</body>
</html>
