name: Dependency Remediation Probe

on:
  push:
    branches:
      - feat/tiger-profit-os-platform-v1

permissions:
  contents: read

jobs:
  deepmerge-remediation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      SHOP_DOMAIN: local-dev.myshopify.com
      SHOPIFY_CLIENT_ID: test-client-id
      SHOPIFY_CLIENT_SECRET: test-client-secret
      SHOPIFY_REQUIRE_AUTH: "false"
      SHOPIFY_LIVE_CONNECT: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Generate patched lockfile in runner only
        run: |
          npm pkg set 'overrides.deepmerge-ts=8.0.2'
          npm install --package-lock-only --ignore-scripts

      - name: Install patched dependency graph
        run: npm ci

      - name: Verify patched dependency
        run: |
          node -e "const p=require('./node_modules/deepmerge-ts/package.json'); console.log('deepmerge-ts',p.version); if (!p.version.startsWith('8.')) process.exit(1)"
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high

      - name: Validate patched app
        run: |
          npm run db:validate
          npm run build
          npm test

      - name: Upload patched manifests
        uses: actions/upload-artifact@v4
        with:
          name: dependency-remediation-manifests
          path: |
            app/package.json
            app/package-lock.json
          if-no-files-found: error
