name: Bot Staging Preview

on:
  push:
    branches:
      - feat/tiger-profit-os-platform-v1
    paths:
      - app/admin/bot-live-test.html
      - .github/workflows/bot-staging-preview.yml
  pull_request:
    branches:
      - master
    paths:
      - app/admin/bot-live-test.html
      - .github/workflows/bot-staging-preview.yml
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: bot-staging-preview-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    env:
      APP_PORT: "3000"
      SHOP_DOMAIN: local-dev.myshopify.com
      SHOPIFY_REQUIRE_AUTH: "false"
      SHOPIFY_LIVE_CONNECT: "false"
      SHOPIFY_PIXEL_INGEST_ENABLED: "false"
      ENABLE_DEMO_SEED: "false"
      ANALYTICS_MODE: TEST
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: Prepare ephemeral database
        run: |
          npx prisma generate
          npx prisma db push

      - name: Start staging app
        run: |
          node --import tsx src/server.ts >/tmp/tiger-bot-staging-app.log 2>&1 &
          echo $! >/tmp/tiger-bot-staging-app.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/tiger-bot-staging-app.log
          exit 1

      - name: Install Cloudflare tunnel client
        working-directory: /
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared

      - name: Open temporary public staging URL
        working-directory: /
        run: |
          /tmp/cloudflared tunnel --url http://127.0.0.1:3000 --no-autoupdate >/tmp/tiger-bot-tunnel.log 2>&1 &
          echo $! >/tmp/tiger-bot-tunnel.pid
          URL=""
          for i in $(seq 1 45); do
            URL=$(grep -Eo 'https://[-a-zA-Z0-9]+\.trycloudflare\.com' /tmp/tiger-bot-tunnel.log | head -1 || true)
            if [ -n "$URL" ]; then break; fi
            sleep 1
          done
          if [ -z "$URL" ]; then
            cat /tmp/tiger-bot-tunnel.log
            exit 1
          fi
          echo "BOT_STAGING_BASE_URL=$URL" >> "$GITHUB_ENV"
          echo "BOT_STAGING_TEST_PAGE=$URL/admin/bot-live-test.html" >> "$GITHUB_ENV"
          echo "BOT_STAGING_TEST_PAGE=$URL/admin/bot-live-test.html"

      - name: Publish staging link to PR
        if: github.event_name == 'pull_request'
        working-directory: /
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          BODY="Temporary bot staging is live for about 20 minutes:\n\n${BOT_STAGING_TEST_PAGE}\n\nThis preview uses the real TIGER bot routing / guardrails / conversation runtime with the mock model only. No production Shopify credentials or model API keys are loaded."
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$BODY" >/dev/null
          echo "$BODY"

      - name: Keep staging alive
        working-directory: /
        run: |
          echo "Keeping ${BOT_STAGING_TEST_PAGE} alive for about 20 minutes."
          sleep 1200
