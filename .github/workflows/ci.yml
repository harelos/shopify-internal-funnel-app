name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches:
      - feat/tiger-profit-os-platform-v1
      - feat/tiger-popup-platform-phase1

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      SHOP_DOMAIN: local-dev.myshopify.com
      SHOPIFY_CLIENT_ID: test-client-id
      SHOPIFY_CLIENT_SECRET: test-client-secret
      SHOPIFY_REQUIRE_AUTH: "false"
      SHOPIFY_LIVE_CONNECT: "false"
      QUALIFIED_COMMERCE_TARGET_COUNTRIES: "IL"
      POPUP_STAGING_ENABLED: "false"
      POPUP_STAGING_EVENT_INGEST: "false"
      POPUP_CONTEXT_COLLECTOR_ENABLED: "false"
      POPUP_KILL_SWITCH: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: Production dependency audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Full dependency audit visibility
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Admin and storefront JavaScript syntax
        run: |
          node --check admin/js/api.js
          node --check admin/js/bot.js
          node --check admin/js/bot-dashboard.js
          node --check admin/js/commerce-intelligence.js
          node --check admin/js/popups.js
          node --check admin/js/popup-preview-runtime.js
          node --check admin/js/profit-analytics.js
          node --check storefront/popup-session-context.js
          node --check test/bot-ui-preview-server.mjs
          node --check test/popup-ui-preview-server.mjs

      - name: TypeScript build
        run: npm run build

      - name: Test
        run: npm test

      - name: Admin browser render QA
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          node test/bot-ui-preview-server.mjs >/tmp/tiger-admin-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          "$BROWSER" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --screenshot=/tmp/tiger-bot-mobile.png http://127.0.0.1:4173/bot.html
          "$BROWSER" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1000 --screenshot=/tmp/tiger-bot-desktop.png http://127.0.0.1:4173/bot.html
          "$BROWSER" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --screenshot=/tmp/tiger-bot-control-mobile.png http://127.0.0.1:4173/bot-dashboard.html
          "$BROWSER" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1200 --screenshot=/tmp/tiger-bot-control-desktop.png http://127.0.0.1:4173/bot-dashboard.html
          "$BROWSER" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --screenshot=/tmp/tiger-commerce-mobile.png http://127.0.0.1:4173/commerce-intelligence.html
          "$BROWSER" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1200 --screenshot=/tmp/tiger-commerce-desktop.png http://127.0.0.1:4173/commerce-intelligence.html
          test -s /tmp/tiger-bot-mobile.png
          test -s /tmp/tiger-bot-desktop.png
          test -s /tmp/tiger-bot-control-mobile.png
          test -s /tmp/tiger-bot-control-desktop.png
          test -s /tmp/tiger-commerce-mobile.png
          test -s /tmp/tiger-commerce-desktop.png
          file /tmp/tiger-bot-mobile.png /tmp/tiger-bot-desktop.png /tmp/tiger-bot-control-mobile.png /tmp/tiger-bot-control-desktop.png /tmp/tiger-commerce-mobile.png /tmp/tiger-commerce-desktop.png

      - name: Upload admin render artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tiger-admin-ui-renders
          path: |
            /tmp/tiger-bot-mobile.png
            /tmp/tiger-bot-desktop.png
            /tmp/tiger-bot-control-mobile.png
            /tmp/tiger-bot-control-desktop.png
            /tmp/tiger-commerce-mobile.png
            /tmp/tiger-commerce-desktop.png
          if-no-files-found: error

      - name: Popup Studio browser render and fail-safe QA
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          node test/popup-ui-preview-server.mjs >/tmp/tiger-popup-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          "$BROWSER" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --screenshot=/tmp/tiger-popup-mobile.png http://127.0.0.1:4174/popups.html
          "$BROWSER" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1000 --screenshot=/tmp/tiger-popup-desktop.png http://127.0.0.1:4174/popups.html
          "$BROWSER" --headless --no-sandbox --disable-gpu --virtual-time-budget=1500 --dump-dom http://127.0.0.1:4174/popup-safety-test.html > /tmp/tiger-popup-safety.html
          grep 'data-popup-safety-self-test="pass"' /tmp/tiger-popup-safety.html
          test -s /tmp/tiger-popup-mobile.png
          test -s /tmp/tiger-popup-desktop.png
          file /tmp/tiger-popup-mobile.png /tmp/tiger-popup-desktop.png

      - name: Upload Popup Studio render artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tiger-popup-ui-renders
          path: |
            /tmp/tiger-popup-mobile.png
            /tmp/tiger-popup-desktop.png
            /tmp/tiger-popup-safety.html
          if-no-files-found: error

      - name: Build dependency remediation candidate
        run: |
          npm pkg set 'overrides.deepmerge-ts=8.0.2'
          npm install --package-lock-only --ignore-scripts
          npm ci
          node -e "const p=require('./node_modules/deepmerge-ts/package.json'); console.log('deepmerge-ts', p.version); if (!p.version.startsWith('8.')) process.exit(1)"

      - name: Verify remediated dependency graph
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high
          npm run db:validate
          npm run build
          npm test

      - name: Upload dependency remediation candidate
        uses: actions/upload-artifact@v4
        with:
          name: dependency-remediation-manifests
          path: |
            app/package.json
            app/package-lock.json
          if-no-files-found: error
